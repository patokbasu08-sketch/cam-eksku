<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kamera PTSP - Auto Capture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Mengubah background utama menjadi terang bersih */
    body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    .kamera-container { 
      max-width: 450px; 
      margin: 20px auto; 
      background: #ffffff; 
      padding: 20px; 
      border-radius: 15px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      border: 1px solid #dee2e6;
    }
    
    .video-wrapper { 
      position: relative; 
      width: 100%; 
      aspect-ratio: 3 / 4; 
      background: #e9ecef; 
      border-radius: 10px; 
      overflow: hidden; 
      border: 2px solid #185c5b; 
    }
    
    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scaleX(-1); 
    }
    
    .face-guide { 
      position: absolute; 
      top: 15%; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 45%; 
      height: 55%; 
      border: 2px dashed rgba(24, 92, 91, 0.7); /* Menyesuaikan warna garis agar kontras di background terang */
      border-radius: 50% / 40%; 
      pointer-events: none; 
      transition: 0.3s; 
    }
    
    .face-guide.detected { 
      border-color: #28a745; 
      box-shadow: 0 0 15px rgba(40,167,69,0.4); 
    }
    
    .guide-text { 
      position: absolute; 
      bottom: 10px; 
      width: 100%; 
      text-align: center; 
      font-size: 11px; 
      background: rgba(255, 255, 255, 0.85); 
      color: #185c5b; 
      font-weight: bold;
      padding: 4px 0; 
      margin: 0; 
    }
  </style>
</head>
<body>

  <div class="kamera-container text-center">
    <h5 class="fw-bold mb-1" style="color: #185c5b;">🤖 Auto-Capture Kamera PTSP</h5>
    <p id="statusPanduan" class="text-muted small mb-3">Posisikan wajah di dalam kotak panduan...</p>
    
    <div class="video-wrapper">
      <video id="videoStream" autoplay playsinline></video>
      <div id="faceGuideBox" class="face-guide"></div>
      <p class="guide-text" id="teksPanduan">Posisikan Wajah di Sini</p>
    </div>
    
    <canvas id="canvasFoto" style="display:none;"></canvas>
    
    <div class="mt-3">
      <button id="btnManual" class="btn btn-outline-secondary w-100 fw-bold py-2" onclick="ambilDanKirimFoto()">📸 Ambil Foto Manual</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoStream');
    const guideBox = document.getElementById('faceGuideBox');
    const statusPanduan = document.getElementById('statusPanduan');
    let isCaptured = false; 

    navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 768 }, height: { ideal: 1024 }, facingMode: "user" }, 
      audio: false 
    })
    .then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        mulaiDeteksiWajahOtomatis();
      };
    })
    .catch(err => {
      alert("❌ Gagal membuka kamera: " + err.message);
    });

    async function mulaiDeteksiWajahOtomatis() {
      if (!('FaceDetector' in window)) {
        statusPanduan.innerText = "Gunakan tombol manual di bawah untuk mengambil foto.";
        return;
      }

      const faceDetector = new FaceDetector({ fastDetect: true, maxFaces: 1 });

      setInterval(async () => {
        if (isCaptured) return; 

        try {
          const faces = await faceDetector.detect(video);
          
          if (faces.length > 0) {
            let face = faces[0].boundingbox; 
            let videoWidth = video.videoWidth;
            let videoHeight = video.videoHeight;
            
            let isCentered = (
              face.x > videoWidth * 0.20 && 
              (face.x + face.width) < videoWidth * 0.80 &&
              face.y > videoHeight * 0.10 &&
              face.height > videoHeight * 0.25 
            );

            if (isCentered) {
              guideBox.classList.add('detected');
              statusPanduan.innerHTML = "<span class='text-success fw-bold'>🎯 Wajah Sesuai! Memotret dalam 1 detik...</span>";
              
              isCaptured = true;
              setTimeout(() => {
                ambilDanKirimFoto();
              }, 1000);
            } else {
              guideBox.classList.remove('detected');
              statusPanduan.innerText = "Geser posisi wajah agar pas di dalam kotak panduan.";
            }
          } else {
            guideBox.classList.remove('detected');
            statusPanduan.innerText = "Mencari wajah di depan kamera...";
          }
        } catch (e) {
          console.error("Kesalahan deteksi wajah:", e);
        }
      }, 600); 
    }

    function ambilDanKirimFoto() {
      const canvas = document.getElementById('canvasFoto');
      canvas.width = 480;
      canvas.height = 640;
      
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      
      let vWidth = video.videoWidth;
      let vHeight = video.videoHeight;
      let targetRatio = 3 / 4;
      let currentRatio = vWidth / vHeight;
      
      let sWidth, sHeight, sx, sy;
      if (currentRatio > targetRatio) {
        sHeight = vHeight;
        sWidth = vHeight * targetRatio;
        sx = (vWidth - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = vWidth;
        sHeight = vWidth / targetRatio;
        sx = 0;
        sy = (vHeight - sHeight) / 2;
      }
      
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
      
      let dataURL = canvas.toDataURL('image/jpeg', 0.70);
      let base64Data = dataURL.split(',')[1];
      
      statusPanduan.innerText = "⏳ Menyimpan langsung ke Google Drive...";

      // Masukkan URL /exec terbaru Anda di sini
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzuoj3wrdJ1ODsCdaBxC3qBuTCGNaEFIdj3qSFDDC1ASn5g8Bvza9tm16QIZG5EIHR1rw/exec";

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          fotoData: base64Data,
          namaFile: 'tamu_' + new Date().getTime() + '.jpg'
        })
      })
      .then(response => response.text()) // Ambil sebagai text mentah dulu untuk menghindari error parsing JSON CORS
      .then(textData => {
        try {
          let result = JSON.parse(textData);
          if (result.success) {
            localStorage.setItem('tempFotoUrlDrive', result.fileUrl);
            alert("✅ Foto berhasil disimpan ke Google Drive!");
            window.close();
          } else {
            alert("❌ Gagal menyimpan ke Drive: " + result.message);
          }
        } catch (parseError) {
          // Jika respons berhasil terkirim tapi terhalang teks pembungkus, kita cek apakah file sudah masuk ke Drive
          console.warn("Respon mentah:", textData);
          alert("✅ Perintah unggah terkirim! Silakan cek Google Drive Anda.");
          window.close();
        }
      })
      .catch(error => {
        console.error("Error:", error);
        alert("❌ Terjadi kesalahan koneksi saat mengunggah foto.");
      });
    }
  </script>
</body>
</html>
