<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera PTSP - Auto Capture</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; color: #333; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    .kamera-container {
      max-width: 450px;
      margin: 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 1px solid #dee2e6;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #e9ecef;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #185c5b;
    }

    video, canvas.overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas.overlay-canvas {
      pointer-events: none;
    }

    .face-guide {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 55%;
      border: 2px dashed rgba(24, 92, 91, 0.75);
      border-radius: 50% / 40%;
      pointer-events: none;
      transition: 0.25s;
    }

    .face-guide.detected {
      border-color: #28a745;
      border-style: solid;
      box-shadow: 0 0 15px rgba(40,167,69,0.45);
    }

    .guide-text {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.88);
      color: #185c5b;
      font-weight: bold;
      padding: 4px 0;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="kamera-container text-center">
    <h5 class="fw-bold mb-1" style="color: #185c5b;">🤖 Auto-Capture Kamera PTSP</h5>
    <p id="statusPanduan" class="text-muted small mb-3">Memuat deteksi wajah & kedipan mata...</p>

    <div class="video-wrapper">
      <video id="videoStream" autoplay playsinline muted></video>
      <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
      <div id="faceGuideBox" class="face-guide"></div>
      <p class="guide-text" id="teksPanduan">Posisikan Wajah di Area & Kedipkan Mata</p>
    </div>

    <div class="mt-2 text-start">
      <label class="form-label small fw-semibold mb-1">Mode Jepret Otomatis:</label>
      <select id="modeCapture" class="form-select form-select-sm">
        <option value="blink_in_box" selected>Wajah di Area + Kedipan Mata</option>
        <option value="hold_in_box">Diam di Area Wajah (1,5 detik)</option>
        <option value="blink_only">Kedipan Mata Saja</option>
      </select>
    </div>

    <canvas id="canvasFoto" style="display:none;"></canvas>

    <div class="mt-3">
      <button id="btnManual" class="btn btn-outline-secondary w-100 fw-bold py-2" onclick="ambilDanKirimFoto()">📸 Ambil Foto Manual</button>
    </div>
  </div>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById('videoStream');
    const overlay = document.getElementById('overlayCanvas');
    const overlayCtx = overlay.getContext('2d');
    const guideBox = document.getElementById('faceGuideBox');
    const statusPanduan = document.getElementById('statusPanduan');
    const modeSelect = document.getElementById('modeCapture');

    // Landmark mata kiri & kanan untuk menghitung Eye Aspect Ratio (EAR)
    const LEFT_EYE = [33, 160, 158, 133, 153, 144];
    const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

    let faceLandmarker = null;
    let isCaptured = false;
    let lastVideoTime = -1;
    let blinkFrames = 0;
    let inAreaStart = null;

    function jarak(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function hitungEAR(landmarks, idx) {
      const p1 = landmarks[idx[0]];
      const p2 = landmarks[idx[1]];
      const p3 = landmarks[idx[2]];
      const p4 = landmarks[idx[3]];
      const p5 = landmarks[idx[4]];
      const p6 = landmarks[idx[5]];
      const vertikal = jarak(p2, p6) + jarak(p3, p5);
      const horizontal = 2.0 * jarak(p1, p4);
      return horizontal === 0 ? 0.3 : vertikal / horizontal;
    }

    // Area panduan oval sesuai .face-guide (top: 15%, height: 55%, width: 55%, centerX: 0.5)
    function cekWajahDiArea(landmarks) {
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      for (const pt of landmarks) {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      }

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const faceW = maxX - minX;

      const diTengah =
        centerX >= 0.25 && centerX <= 0.75 &&
        centerY >= 0.22 && centerY <= 0.68;

      const ukuranPas = faceW >= 0.20 && faceW <= 0.68;
      return diTengah && ukuranPas;
    }

    function gambarTitikMata(landmarks) {
      overlay.width = video.videoWidth || 480;
      overlay.height = video.videoHeight || 640;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);

      overlayCtx.fillStyle = "rgba(40, 167, 69, 0.75)";
      for (const idx of [...LEFT_EYE, ...RIGHT_EYE]) {
        const pt = landmarks[idx];
        overlayCtx.beginPath();
        overlayCtx.arc(pt.x * overlay.width, pt.y * overlay.height, 2.5, 0, Math.PI * 2);
        overlayCtx.fill();
      }
    }

    async function siapkanModel() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    async function mulaiKameraDanDeteksi() {
      try {
        await siapkanModel();
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 800 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        statusPanduan.innerText = "Posisikan wajah di dalam area lalu kedipkan mata.";
        requestAnimationFrame(loopDeteksi);
      } catch (err) {
        alert("❌ Gagal membuka kamera: " + err.message);
      }
    }

    function loopDeteksi() {
      if (isCaptured) return;

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime && faceLandmarker) {
        lastVideoTime = video.currentTime;
        const hasil = faceLandmarker.detectForVideo(video, performance.now());
        const landmarks = hasil.faceLandmarks?.[0];

        if (!landmarks) {
          overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
          guideBox.classList.remove('detected');
          inAreaStart = null;
          blinkFrames = 0;
          statusPanduan.innerText = "Mencari wajah di depan kamera...";
        } else {
          gambarTitikMata(landmarks);
          const diArea = cekWajahDiArea(landmarks);
          guideBox.classList.toggle('detected', diArea);

          const earKiri = hitungEAR(landmarks, LEFT_EYE);
          const earKanan = hitungEAR(landmarks, RIGHT_EYE);
          const rataEAR = (earKiri + earKanan) / 2;

          // Mata dianggap berkedip saat EAR turun di bawah ambang batas
          if (rataEAR < 0.20) {
            blinkFrames++;
          } else {
            blinkFrames = 0;
          }

          const sekarang = Date.now();
          if (diArea && !inAreaStart) inAreaStart = sekarang;
          if (!diArea) inAreaStart = null;

          const mode = modeSelect.value;

          if (mode === "blink_in_box") {
            if (!diArea) {
              statusPanduan.innerText = "Geser wajah agar pas di dalam area panduan.";
            } else {
              statusPanduan.innerHTML = "<span class='text-success fw-bold'>👁️ Wajah pas! Kedipkan mata untuk memotret.</span>";
              if (blinkFrames >= 2) {
                isCaptured = true;
                window.ambilDanKirimFoto();
              }
            }
          } else if (mode === "hold_in_box") {
            if (!diArea) {
              statusPanduan.innerText = "Geser wajah agar pas di dalam area panduan.";
            } else {
              const selisih = sekarang - inAreaStart;
              const sisa = Math.max(0, ((1500 - selisih) / 1000).toFixed(1));
              statusPanduan.innerHTML = `<span class='text-success fw-bold'>🎯 Tahan posisi di area... (${sisa} dtk)</span>`;
              if (selisih >= 1500) {
                isCaptured = true;
                window.ambilDanKirimFoto();
              }
            }
          } else if (mode === "blink_only") {
            statusPanduan.innerHTML = "<span class='text-success fw-bold'>👁️ Kedipkan mata untuk memotret.</span>";
            if (blinkFrames >= 2) {
              isCaptured = true;
              window.ambilDanKirimFoto();
            }
          }
        }
      }

      requestAnimationFrame(loopDeteksi);
    }

    // Fungsi ambil & unggah tetap dipertahankan sesuai struktur asli Anda
    window.ambilDanKirimFoto = function () {
      isCaptured = true;
      const canvas = document.getElementById('canvasFoto');
      canvas.width = 480;
      canvas.height = 640;

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;
      const targetRatio = 3 / 4;
      const currentRatio = vWidth / vHeight;

      let sWidth, sHeight, sx, sy;
      if (currentRatio > targetRatio) {
        sHeight = vHeight;
        sWidth = vHeight * targetRatio;
        sx = (vWidth - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = vWidth;
        sHeight = vWidth / targetRatio;
        sx = 0;
        sy = (vHeight - sHeight) / 2;
      }

      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      const dataURL = canvas.toDataURL('image/jpeg', 0.70);
      const base64Data = dataURL.split(',')[1];

      statusPanduan.innerText = "⏳ Mengunggah foto ke Google Drive...";
      const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNsEzA3PBc4UnWLR0rxvB9rlCOTqg4S7ZiW5T95v07HOrMKfV97x5z7eZ17OHpKlE78w/exec";

      fetch(WEB_APP_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8",
        },
        body: JSON.stringify({
          fotoData: base64Data,
          namaFile: 'tamu_' + new Date().getTime() + '.jpg'
        })
      })
      .then(response => response.text())
      .then(textData => {
        try {
          const result = JSON.parse(textData);
          if (result.success) {
            statusPanduan.innerHTML = "<span class='text-success fw-bold'>✅ Berhasil! Menghubungkan ke PTSP...</span>";

            if (window.opener && !window.opener.closed) {
              window.opener.postMessage({ type: 'FOTO_BERHASIL', url: result.fileUrl }, "*");
            }

            setTimeout(() => {
              window.close();
            }, 1000);
          } else {
            isCaptured = false;
            alert("❌ Gagal: " + result.message);
          }
        } catch (e) {
          console.error("Parse error:", e);
          isCaptured = false;
          alert("❌ Terjadi kesalahan memproses respons server.");
        }
      })
      .catch(error => {
        console.error("Error:", error);
        isCaptured = false;
        alert("❌ Terjadi kesalahan koneksi saat mengunggah foto.");
      });
    };

    mulaiKameraDanDeteksi();
  </script>
</body>
</html>
